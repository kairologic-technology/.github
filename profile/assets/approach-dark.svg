<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Our approach: Understand, Configure, Validate, Prepare the handover</title><rect width="1180" height="300" rx="22" fill="#12263A" stroke="#24405A" stroke-width="2"/><text x="48" y="64" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#2FBF9C">OUR APPROACH</text><text x="48" y="108" font-family="Georgia,'Times New Roman',serif" font-size="36" font-style="italic" fill="#F0F4F8">Start with the work.</text><path id="p" d="M120 168H1060" stroke="#24405A" stroke-width="4"/><circle cx="120" cy="168" r="22" fill="#0D1117" stroke="#2FBF9C" stroke-width="3"/><text x="120" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#F0F4F8">01</text><text x="86" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#F0F4F8">Understand</text><text x="86" y="246" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9FB3C8">the process</text><text x="86" y="272" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="#2FBF9C">real information, handoffs</text><circle cx="433" cy="168" r="22" fill="#0D1117" stroke="#2FBF9C" stroke-width="3"/><text x="433" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#F0F4F8">02</text><text x="399" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#F0F4F8">Configure</text><text x="399" y="246" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9FB3C8">the system</text><text x="399" y="272" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="#2FBF9C">around those exact needs</text><circle cx="746" cy="168" r="22" fill="#0D1117" stroke="#2FBF9C" stroke-width="3"/><text x="746" y="175" text-a