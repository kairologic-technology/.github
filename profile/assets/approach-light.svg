<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><title id="t">Our approach: Understand, Configure, Validate, Prepare the handover</title><rect width="1180" height="300" rx="22" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/><text x="48" y="64" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#16876D">OUR APPROACH</text><text x="48" y="108" font-family="Georgia,'Times New Roman',serif" font-size="36" font-style="italic" fill="#102A43">Start with the work.</text><path id="p" d="M120 168H1060" stroke="#D9E2EC" stroke-width="4"/><circle cx="120" cy="168" r="22" fill="#F4F7FA" stroke="#16876D" stroke-width="3"/><text x="120" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#102A43">01</text><text x="86" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#102A43">Understand</text><text x="86" y="246" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4B6379">the process</text><text x="86" y="272" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="#16876D">real information, handoffs</text><circle cx="433" cy="168" r="22" fill="#F4F7FA" stroke="#16876D" stroke-width="3"/><text x="433" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#102A43">02</text><text x="399" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#102A43">Configure</text><text x="399" y="246" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4B6379">the system</text><text x="399" y="272" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="#16876D">around those exact needs</text><circle cx="746" cy="168" r="22" fill="#F4F7FA" stroke="#16876D" stroke-width="3"/><text x="746" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#102A43">03</text><text x="712" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#102A43">Validate</text><text x="712" y="246" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4B6379">with your team</text><text x="712" y="272" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="#16876D">live data</text><circle cx="1059" cy="168" r="22" fill="#F4F7FA" stroke="#16876D" stroke-width="3"/><text x="1059" y="175" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#102A43">04</text><text x="1025" y="222" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#102A43">Prepare</text><text x="1025" y="246" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4B6379">the handover</text><text x="1025" y="272" font-family="Georgia,'Times New Roman',serif" font-size="16" font-style="italic" fill="#16876D">clear and effortless</text><circle r="7" fill="#16876D"><animateMotion dur="6s" repeatCount="indefinite" path="M120 168H1060"/></circle><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>